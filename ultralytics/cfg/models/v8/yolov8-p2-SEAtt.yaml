# Ultralytics YOLO 🚀, GPL-3.0 license
# 适配YOLOv8 8.0.49版本 - 四检测头(P2/P3/P4/P5) + SEAttention
# 类别数：6 | 深度因子：0.6 | 宽度因子：0.875

# 基础参数
nc: 6
depth_multiple: 0.60
width_multiple: 0.875
anchors:
  - [10, 13, 16, 30, 33, 23] # P2
  - [30, 61, 62, 45, 59, 119] # P3
  - [116, 90, 156, 198, 373, 326] # P4
  - [326, 456, 456, 326, 512, 512] # P5

# YOLOv8 Backbone (增强特征提取 + SEAttention)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [112, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [224, 3, 2]] # 1-P2/4
  - [-1, 8, C2f, [224, True]] # 2
  - [-1, 1, Conv, [448, 3, 2]] # 3-P3/8
  - [-1, 16, C2f, [448, True]] # 4
  - [-1, 1, Conv, [896, 3, 2]] # 5-P4/16
  - [-1, 16, C2f, [896, True]] # 6
  - [-1, 1, Conv, [1792, 3, 2]] # 7-P5/32
  - [-1, 8, C2f, [1792, True]] # 8
  - [-1, 1, SPPF, [1792, 5]] # 9
  - [-1, 1, SEAttention, [16]] # 10  新增SEAttention模块

# YOLOv8 Head (四检测头，P2/P3/P4/P5)
head:
  # P5 -> P4 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  拼接P4特征（原第6层）
  - [-1, 8, C2f, [896]] # 13

  # P4 -> P3 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  拼接P3特征（原第4层）
  - [-1, 8, C2f, [448]] # 16

  # P3 -> P2 上采样融合 (新增P2检测层)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18  拼接P2特征（原第2层）
  - [-1, 8, C2f, [224]] # 19  (P2/4 检测层)

  # P2 -> P3 下采样融合
  - [-1, 1, Conv, [224, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21  拼接P3特征（原第16层，现为16）
  - [-1, 8, C2f, [448]] # 22  (P3/8 检测层)

  # P3 -> P4 下采样融合
  - [-1, 1, Conv, [448, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24  拼接P4特征（原第12层，现为13）
  - [-1, 8, C2f, [896]] # 25  (P4/16 检测层)

  # P4 -> P5 下采样融合 (使用经过SEAttention后的特征)
  - [-1, 1, Conv, [896, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27  拼接P5特征（原第9层改为10，即SEAttention输出）
  - [-1, 8, C2f, [1792]] # 28  (P5/32 检测层)

  # Detect层，输入4个检测头的层索引（已根据新编号调整）
  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29
