# Ultralytics YOLO 🚀, GPL-3.0 license
# 适配YOLOv8 8.0.49版本 - 四检测头(P2/P3/P4/P5) + CBAM注意力
# 类别数：6 | 深度因子：0.6 | 宽度因子：0.875

# 基础参数
nc: 6  # 类别数量
depth_multiple: 0.60  # 模型深度因子 (YOLOv8x=1.0, 此处适度增强)
width_multiple: 0.875 # 模型宽度因子 (YOLOv8x=1.0, 平衡精度与速度)
anchors:
  - [10,13, 16,30, 33,23]  # P2 小目标锚框
  - [30,61, 62,45, 59,119] # P3 中小目标锚框
  - [116,90, 156,198, 373,326] # P4 中目标锚框
  - [326,456, 456,326, 512,512] # P5 大目标锚框

# YOLOv8 Backbone (增强特征提取，加入CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [112, 3, 2]]  # 0-P1/2 (112=64*0.875*2)
  - [-1, 1, Conv, [224, 3, 2]]  # 1-P2/4 (224=128*0.875*2)
  - [-1, 8, C2f, [224, True]]   # 2 (重复次数8，增强P2特征)
  - [-1, 1, CBAM, []]           # 3 CBAM注意力
  - [-1, 1, Conv, [448, 3, 2]]  # 4-P3/8 (448=256*0.875*2)
  - [-1, 16, C2f, [448, True]]  # 5 (重复次数16，强化P3特征)
  - [-1, 1, CBAM, []]           # 6 CBAM注意力
  - [-1, 1, Conv, [896, 3, 2]]  # 7-P4/16 (896=512*0.875*2)
  - [-1, 16, C2f, [896, True]]  # 8 (重复次数16，强化P4特征)
  - [-1, 1, CBAM, []]           # 9 CBAM注意力
  - [-1, 1, Conv, [1792, 3, 2]] # 10-P5/32 (1792=1024*0.875*2)
  - [-1, 8, C2f, [1792, True]]  # 11 (重复次数8，强化P5特征)
  - [-1, 1, CBAM, []]           # 12 CBAM注意力
  - [-1, 1, SPPF, [1792, 5]]    # 13 (SPPF模块，增强全局特征)

# YOLOv8 Head (四检测头，P2/P3/P4/P5，所有索引已根据backbone新增层调整)
head:
  # P5 -> P4 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 8], 1, Concat, [1]]                  # 15 拼接P4特征（原索引6 → 8）
  - [-1, 8, C2f, [896]]                        # 16

  # P4 -> P3 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [[-1, 5], 1, Concat, [1]]                  # 18 拼接P3特征（原索引4 → 5）
  - [-1, 8, C2f, [448]]                        # 19

  # P3 -> P2 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20
  - [[-1, 2], 1, Concat, [1]]                  # 21 拼接P2特征（原索引2 → 2）
  - [-1, 8, C2f, [224]]                        # 22

  # P2 -> P3 下采样融合
  - [-1, 1, Conv, [224, 3, 2]]                 # 23
  - [[-1, 19], 1, Concat, [1]]                 # 24 拼接P3特征（原索引15 → 19）
  - [-1, 8, C2f, [448]]                        # 25

  # P3 -> P4 下采样融合
  - [-1, 1, Conv, [448, 3, 2]]                 # 26
  - [[-1, 16], 1, Concat, [1]]                 # 27 拼接P4特征（原索引12 → 16）
  - [-1, 8, C2f, [896]]                        # 28

  # P4 -> P5 下采样融合
  - [-1, 1, Conv, [896, 3, 2]]                 # 29
  - [[-1, 13], 1, Concat, [1]]                 # 30 拼接P5特征（原索引9 → 13）
  - [-1, 8, C2f, [1792]]                       # 31

  # 适配8.0.49版本的Detect层
  # 四检测头输出：P2/P3/P4/P5，对应层索引已更新
  - [[22, 25, 28, 31], 1, Detect, [nc]]        # 32