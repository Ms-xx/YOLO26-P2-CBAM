# Ultralytics YOLO 🚀, GPL-3.0 license
# 适配YOLOv8 8.0.49版本 - 四检测头(P2/P3/P4/P5)配置
# 类别数：6 | 深度因子：0.6 | 宽度因子：0.875

# 基础参数
nc: 6  # 类别数量
depth_multiple: 0.60  # 模型深度因子 (YOLOv8x=1.0, 此处适度增强)
width_multiple: 0.875 # 模型宽度因子 (YOLOv8x=1.0, 平衡精度与速度)
anchors:
  - [10,13, 16,30, 33,23]  # P2 小目标锚框
  - [30,61, 62,45, 59,119] # P3 中小目标锚框
  - [116,90, 156,198, 373,326] # P4 中目标锚框
  - [326,456, 456,326, 512,512] # P5 大目标锚框

# YOLOv8 Backbone (增强特征提取)
backbone:
  - [-1, 1, Conv, [112, 3, 2]]  # 0-P1/2 (112=64*0.875*2)
  - [-1, 1, Conv, [224, 3, 2]]  # 1-P2/4 (224=128*0.875*2)
  - [-1, 8, C2f, [224, True]]   # 2 (重复次数8，增强P2特征)
  - [-1, 1, Conv, [448, 3, 2]]  # 3-P3/8 (448=256*0.875*2)
  - [-1, 16, C2f, [448, True]]  # 4 (重复次数16，强化P3特征)
  - [-1, 1, Conv, [896, 3, 2]]  # 5-P4/16 (896=512*0.875*2)
  - [-1, 16, C2f, [896, True]]  # 6 (重复次数16，强化P4特征)
  - [-1, 1, Conv, [1792, 3, 2]] # 7-P5/32 (1792=1024*0.875*2)
  - [-1, 8, C2f, [1792, True]]  # 8 (重复次数8，强化P5特征)
  - [-1, 1, SPPF, [1792, 5]]    # 9 (SPPF模块，增强全局特征)

# YOLOv8 Head (四检测头，P2/P3/P4/P5)
head:
  # P5 -> P4 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11 拼接P4特征
  - [-1, 8, C2f, [896]]                        # 12 特征融合

  # P4 -> P3 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14 拼接P3特征
  - [-1, 8, C2f, [448]]                        # 15 (P3/8 检测层)

  # P3 -> P2 上采样融合 (新增P2检测层，提升小目标精度)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 2], 1, Concat, [1]]                  # 17 拼接P2特征
  - [-1, 8, C2f, [224]]                        # 18 (P2/4 检测层 - 小目标)

  # P2 -> P3 下采样融合
  - [-1, 1, Conv, [224, 3, 2]]                 # 19
  - [[-1, 15], 1, Concat, [1]]                 # 20 拼接P3特征
  - [-1, 8, C2f, [448]]                        # 21 (P3/8 检测层)

  # P3 -> P4 下采样融合
  - [-1, 1, Conv, [448, 3, 2]]                 # 22
  - [[-1, 12], 1, Concat, [1]]                 # 23 拼接P4特征
  - [-1, 8, C2f, [896]]                        # 24 (P4/16 检测层)

  # P4 -> P5 下采样融合
  - [-1, 1, Conv, [896, 3, 2]]                 # 25
  - [[-1, 9], 1, Concat, [1]]                  # 26 拼接P5特征
  - [-1, 8, C2f, [1792]]                       # 27 (P5/32 检测层)

  # 🔥 适配8.0.49版本的Detect层 🔥
  # 仅传入nc参数，通道数由代码自动推导，支持4个检测尺度
  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 四检测头：P2/P3/P4/P5