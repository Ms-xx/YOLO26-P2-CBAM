# YOLO26-P2-CBAM object detection model with P2/4 - P5/32 outputs and CBAM attention
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 4  # number of classes
end2end: True  # whether to use end-to-end mode
reg_max: 1  # DFL bins
scales:  # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Custom CBAM module definition
# CBAM applies channel attention and spatial attention sequentially
# Input: feature map; Output: refined feature map (same dimensions)
cbam_args:
  channels: 0  # will be set dynamically based on input channels

# YOLO26-P2-CBAM backbone with CBAM attention after each C2f block
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, CBAM, [256]]  # 3 - CBAM after C2f (P2 stage)
  - [-1, 1, Conv, [256, 3, 2]]  # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 5
  - [-1, 1, CBAM, [512]]  # 6 - CBAM after C2f (P3 stage)
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 2, C3k2, [512, True]]  # 8
  - [-1, 1, CBAM, [512]]  # 9 - CBAM after C2f (P4 stage)
  - [-1, 1, Conv, [1024, 3, 2]]  # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 11
  - [-1, 1, CBAM, [1024]]  # 12 - CBAM after C2f (P5 stage)
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 13
  - [-1, 2, C2PSA, [1024]]  # 14

# YOLO26-P2-CBAM head (4 detection scales: P2, P3, P4, P5)
head:
  # P4 -> P3 upsample
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]  # cat backbone P4 (with CBAM)
  - [-1, 2, C3k2, [512, True]]  # 17

  # P3 -> P2 upsample
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3 (with CBAM)
  - [-1, 2, C3k2, [256, True]]  # 20 (P3/8-small)

  # P2 upsample (additional high-resolution branch)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]  # cat backbone P2 (with CBAM)
  - [-1, 2, C3k2, [128, True]]  # 23 (P2/4-xsmall)

  # Downsample P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]  # cat head P3
  - [-1, 2, C3k2, [256, True]]  # 26 (P3/8-small)

  # Downsample P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, True]]  # 29 (P4/16-medium)

  # Downsample P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]  # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]  # 32 (P5/32-large)

  # Detect head with 4 scales (P2, P3, P4, P5)
  - [[23, 26, 29, 32], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)